services:
  postgres:
    image: postgres:17-alpine
    container_name: order_settlement_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_settlement
    ports:
      - "5432:5432"
    volumes:
      - order_settlement_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_settlement"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  order_settlement_data: